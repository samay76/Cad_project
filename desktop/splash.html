<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<title>Pick Cell</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0;
    font-family: system-ui, -apple-system, "Segoe UI", Ubuntu, sans-serif; -webkit-user-select: none; user-select: none;
    -webkit-app-region: drag; overflow: hidden; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  img { width: 72px; height: 72px; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .3px; }
  .sub { font-size: 12px; color: #94a3b8; margin-top: -8px; }
  .bar { width: 240px; height: 4px; border-radius: 2px; background: #1e293b; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; width: 35%; height: 100%; background: #2563eb; border-radius: 2px;
    animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
  #status { font-size: 13px; color: #cbd5e1; min-height: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <img src="icon.png" alt="">
  <h1>Pick Cell</h1>
  <div class="sub">EC66 + Robotiq 2F-85</div>
  <div class="bar"><i></i></div>
  <div id="status">Starting…</div>
</div>
<script>window.setStatus = (t) => { document.getElementById('status').textContent = t; };</script>
</body>
</html>
